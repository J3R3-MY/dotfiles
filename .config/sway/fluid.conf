# Fluid shell integration — included at the end of ~/.config/sway/config.
#
# Nothing here replaces an existing binding. Your old keys (wofi on $mod+d,
# grimshot, swaylock, wlogout, pamixer/brightnessctl media keys) all still work;
# the volume/brightness OSD reacts to those keys on its own.

set $fluid ~/.config/quickshell/fluid/scripts
set $fluidmsg qs -c fluid ipc call fluid

### Autostart
# Starts the Quickshell shell, or waybar + dunst if Quickshell is missing or
# crashes. Switch manually with: fluid-launch.sh classic | fluid-launch.sh fluid
exec $fluid/fluid-launch.sh
# Clipboard history for $mod+v
exec wl-paste --type text --watch cliphist store
exec wl-paste --type image --watch cliphist store

### Fluid shell (all on keys that were unbound)
bindsym $mod+p exec $fluidmsg toggle launcher
bindsym $mod+v exec $fluidmsg toggle clipboard
bindsym $mod+m exec $fluidmsg toggle media
bindsym $mod+c exec $fluidmsg toggle calendar
bindsym $mod+t exec $fluidmsg toggle theme
bindsym $mod+i exec $fluidmsg controlCenter
bindsym $mod+Escape exec $fluidmsg close
# Keybind cheat sheet ($mod+? and $mod+F1)
bindsym $mod+Shift+slash exec $fluidmsg toggle keys
bindsym $mod+F1 exec $fluidmsg toggle keys
# Fallback shell switch (e.g. if something looks off)
bindsym $mod+Alt+w exec $fluid/fluid-launch.sh classic
bindsym $mod+Alt+q exec $fluid/fluid-launch.sh fluid

### Windows the shell opens
for_window [app_id="nmtui-connect"] floating enable

### Wallpaper + border colours chosen in the theme picker (written by
### fluid-theme.sh). Globs that match nothing are ignored, so before you pick
### a wallpaper the settings above stay in effect.
include ~/.local/state/fluid/sway-*.conf
